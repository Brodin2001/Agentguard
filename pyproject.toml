[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Lightweight runtime enforcement for AI agent tool calls"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "AgentGuard"}
]
dependencies = [
    "langchain>=1.0,<2",
    "langgraph>=1.2,<2",
]

[tool.setuptools.packages.find]
include = ["agentguard*"]

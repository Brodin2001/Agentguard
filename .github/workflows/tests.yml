name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: python -m pip install -e ".[tests]"
      - name: Run core tests
        run: pytest -q tests/test_guard.py

  integrations:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: langchain
            test: tests/test_langchain_integration.py
          - extra: langgraph
            test: tests/test_langgraph_integration.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and integration dependency
        run: python -m pip install -e ".[tests,${{ matrix.extra }}]"
      - name: Run integration tests
        run: pytest -q ${{ matrix.test }}
